<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile — Hot Tea Time</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@800&family=Coco+Gothic:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,700;0,800;0,900;1,700;1,800;1,900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="damask">

<!-- NAV -->
<div id="nav-container"></div>

<!-- PROFILE PAGE -->
<section id="profile-page" style="background: var(--parchment); min-height: 100vh; padding: 80px 0;">
  <div class="section-inner" style="max-width: 900px;">

    <!-- Page Header -->
    <div style="margin-bottom: 60px;">
      <div class="section-label">Your Account</div>
      <h1 class="section-title">My <em>Profile</em></h1>
    </div>

    <!-- Profile Card -->
    <div class="profile-card">
      <!-- User Info Section -->
      <div class="profile-user-section">
        <div class="profile-avatar-large" id="profileAvatarLarge">🫖</div>
        <div class="profile-user-info">
          <h2 class="profile-display-name" id="profileDisplayName">Tea Lover</h2>
          <div class="profile-email" id="profileEmail">user@hotteatime.com</div>
          <div class="profile-membership-badge" id="profileMembershipBadge">
            <span class="badge-icon">✨</span>
            <span class="badge-text">Free Member</span>
          </div>
        </div>
      </div>

      <!-- Stats Grid -->
      <div class="profile-stats-grid">
        <div class="profile-stat-card">
          <div class="stat-icon">📚</div>
          <div class="stat-number" id="statStoriesSaved">0</div>
          <div class="stat-label">Stories Saved</div>
        </div>
        <div class="profile-stat-card">
          <div class="stat-icon">👥</div>
          <div class="stat-number" id="statCharactersSaved">0</div>
          <div class="stat-label">Characters Collected</div>
        </div>
        <div class="profile-stat-card">
          <div class="stat-icon">🔥</div>
          <div class="stat-number" id="statReadingStreak">0</div>
          <div class="stat-label">Day Streak</div>
        </div>
      </div>

      <!-- Preferences Section -->
      <div class="profile-section">
        <h3 class="profile-section-title">Reading Preferences</h3>
        <div class="preference-item">
          <span class="preference-label">Favorite Trope</span>
          <span class="preference-value" id="prefTrope">Not specified</span>
        </div>
        <div class="preference-item">
          <span class="preference-label">Heat Level</span>
          <span class="preference-value" id="prefHeatLevel">Steamy</span>
        </div>
      </div>

      <!-- Quick Links Section -->
      <div class="profile-section">
        <h3 class="profile-section-title">Quick Links</h3>
        <div class="profile-links">
          <a href="my-library.html" class="profile-link-btn">
            <span class="link-icon">📚</span>
            <span>My Library</span>
          </a>
          <a href="#" class="profile-link-btn" onclick="openProfileSettings(event)">
            <span class="link-icon">⚙️</span>
            <span>Profile Settings</span>
          </a>
        </div>
      </div>

      <!-- Logout Section -->
      <div class="profile-section" style="border-top: 1px solid rgba(160, 120, 87, 0.2); padding-top: 32px; margin-top: 32px;">
        <a href="index.html" class="profile-logout-btn">
          <span class="link-icon">🚪</span>
          <span>Logout</span>
        </a>
      </div>
    </div>

  </div>
</section>

<script>
  // Load nav from nav-logged-in.html
  fetch('./nav-logged-in.html')
    .then(response => response.text())
    .then(data => {
      document.getElementById('nav-container').innerHTML = data;
      // Re-attach AI Generator link handler
      const aiGenLink = document.getElementById('ai-generator-link');
      if (aiGenLink) {
        aiGenLink.addEventListener('click', function(e) {
          e.preventDefault();
          openAIGeneratorModal();
        });
      }
    })
    .catch(error => console.error('Error loading nav:', error));

  // Load and display user profile
  function loadUserProfile() {
    const profile = getUserProfile();
    if (!profile) {
      // No profile - redirect to landing page
      window.location.href = 'index.html';
      return;
    }

    // Populate user info
    document.getElementById('profileAvatarLarge').textContent = profile.avatar;
    document.getElementById('profileDisplayName').textContent = profile.displayName;
    document.getElementById('profileEmail').textContent = profile.email;

    // Update membership badge
    const badge = document.getElementById('profileMembershipBadge');
    if (profile.membershipTier === 'inner-circle') {
      badge.innerHTML = '<span class="badge-icon">👑</span><span class="badge-text">Inner Circle Member</span>';
      badge.classList.add('premium');
    }

    // Populate stats
    document.getElementById('statStoriesSaved').textContent = profile.stats.storiesSaved;
    document.getElementById('statCharactersSaved').textContent = profile.stats.charactersCollected;
    document.getElementById('statReadingStreak').textContent = profile.stats.readingStreak;

    // Populate preferences
    const tropeMap = {
      'enemies-to-lovers': 'Enemies to Lovers ⚔️',
      'mafia': 'Mafia 🌹',
      'office': 'Office Romance 💼',
      'not-specified': 'Not specified'
    };
    document.getElementById('prefTrope').textContent = tropeMap[profile.preferences.favoriteTopology] || profile.preferences.favoriteTopology;

    const heatMap = {
      'warm': 'Warm ☕',
      'steamy': 'Steamy 🔥',
      'hot': 'Hot 🌶️'
    };
    document.getElementById('prefHeatLevel').textContent = heatMap[profile.preferences.heatLevel] || profile.preferences.heatLevel;
  }

  // Load profile when page is ready
  document.addEventListener('DOMContentLoaded', function() {
    setTimeout(loadUserProfile, 100);
  });
</script>

<script src="script.js"></script>
</body>
</html>
