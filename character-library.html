<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Character Library — Hot Tea Time</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@800&family=Coco+Gothic:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,700;0,800;0,900;1,700;1,800;1,900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body class="damask">

<!-- NAV -->
<div id="nav-container"></div>

<!-- CHARACTER LIBRARY -->
<section id="character-library" style="background:var(--parchment);">
  <div class="section-inner">
    <div class="reveal">
      <div class="section-label">Meet the Cast</div>
      <h2 class="section-title">The Character <em>Library</em></h2>
      <p class="section-body">Browse a curated collection of unforgettable characters. From brooding dukes to rebellious rogues, find your next literary obsession in our ever-growing character database.</p>
    </div>
  </div>
</section>

<script src="https://unpkg.com/lucide@latest"></script>
<script>
  if(window.lucide && window.lucide.createIcons) {
    window.lucide.createIcons();
  }
</script>
<script>
  // Load nav from nav-logged-in.html
  fetch('./nav-logged-in.html')
    .then(response => response.text())
    .then(data => {
      document.getElementById('nav-container').innerHTML = data;
      // Re-attach AI Generator link handler after nav is loaded
      const aiGenLink = document.getElementById('ai-generator-link');
      if (aiGenLink) {
        aiGenLink.addEventListener('click', function(e) {
          e.preventDefault();
          openAIGeneratorModal();
        });
      }
    })
    .catch(error => console.error('Error loading nav:', error));
</script>

<script src="script.js"></script>
</body>
</html>
