<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Character Library — Hot Tea Time</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@800&family=Coco+Gothic:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,700;0,800;0,900;1,700;1,800;1,900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body class="damask">

<!-- NAV -->
<div id="nav-container"></div>

<!-- CHARACTER LIBRARY -->
<section id="character-library" style="background:var(--parchment);">
  <div class="section-inner">
    <div class="reveal">
      <div class="section-label">Meet the Cast</div>
      <h2 class="section-title">The Character <em>Library</em></h2>
      <p class="section-body">Browse a curated collection of unforgettable characters. From brooding dukes to rebellious rogues, find your next literary obsession in our ever-growing character database.</p>
    </div>

    <!-- Filter Buttons -->
    <div class="character-filters">
      <button class="filter-btn active" data-filter="all">All Characters</button>
      <button class="filter-btn" data-filter="fantasy">Fantasy</button>
      <button class="filter-btn" data-filter="historical">Historical</button>
      <button class="filter-btn" data-filter="contemporary">Contemporary</button>
    </div>

    <!-- Character Grid -->
    <div class="character-grid" id="character-grid">
      <!-- Cards will be dynamically generated -->
    </div>
  </div>
</section>

<!-- CHARACTER DETAIL MODAL -->
<div id="character-modal" class="modal-overlay" style="display: none;">
  <div class="character-modal-container">
    <button class="modal-close" onclick="closeCharacterModal()">&times;</button>

    <div class="character-modal-content">
      <!-- Left: Large portrait -->
      <div class="character-modal-portrait" id="modal-portrait"></div>

      <!-- Right: Full profile -->
      <div class="character-modal-details">
        <div class="character-modal-header">
          <h2 class="character-modal-name" id="modal-name"></h2>
          <p class="character-modal-age-title" id="modal-age-title"></p>
        </div>

        <!-- Personality Traits -->
        <div class="character-modal-section">
          <h4>Personality</h4>
          <div class="character-traits-large" id="modal-traits"></div>
        </div>

        <!-- Full Bio -->
        <div class="character-modal-section">
          <h4>About</h4>
          <p class="character-modal-bio" id="modal-bio"></p>
        </div>

        <!-- Interests -->
        <div class="character-modal-section">
          <h4>Interests</h4>
          <ul class="character-interests-list" id="modal-interests"></ul>
        </div>

        <!-- Story Tropes -->
        <div class="character-modal-section">
          <h4>Perfect For These Tropes</h4>
          <div class="character-tropes" id="modal-tropes"></div>
        </div>

        <!-- Action Buttons -->
        <div class="character-modal-actions">
          <button class="btn-primary" onclick="useCharacterInStory()">Use in Story</button>
          <button class="btn-ghost">Save to Library</button>
        </div>
      </div>
    </div>

    <!-- Navigation arrows -->
    <button class="modal-nav modal-prev" onclick="previousCharacter()">‹</button>
    <button class="modal-nav modal-next" onclick="nextCharacter()">›</button>
  </div>
</div>

<script src="https://unpkg.com/lucide@latest"></script>
<script>
  if(window.lucide && window.lucide.createIcons) {
    window.lucide.createIcons();
  }
</script>
<script src="character-data.js"></script>
<script>
  // Load nav from nav-logged-in.html
  fetch('./nav-logged-in.html')
    .then(response => response.text())
    .then(data => {
      document.getElementById('nav-container').innerHTML = data;
      // Re-attach AI Generator link handler after nav is loaded
      const aiGenLink = document.getElementById('ai-generator-link');
      if (aiGenLink) {
        aiGenLink.addEventListener('click', function(e) {
          e.preventDefault();
          openAIGeneratorModal();
        });
      }
    })
    .catch(error => console.error('Error loading nav:', error));

  // Initialize character grid on page load
  document.addEventListener('DOMContentLoaded', function() {
    renderCharacterGrid('all');
    setupFilterButtons();
  });
</script>

<script src="script.js"></script>
</body>
</html>
